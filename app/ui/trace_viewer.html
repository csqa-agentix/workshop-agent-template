<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run trace</title>
<!-- A self-contained picture of ONE run. Double-click to open; no server needed. Generated by app/telemetry.py -->
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#667085; --line:#e4e7ec; --accent:#2f5bea; --ok:#12805c; --bad:#b42318; --warn:#b54708; --code:#f0f2f5; --chat:#4f7cff; --tool:#18a874; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --card:#1b2027; --ink:#e8eaee; --muted:#9aa3b2; --line:#2c333d; --accent:#7f9bff; --ok:#4cc38a; --bad:#ff7b72; --warn:#e3a23c; --code:#232a33; --chat:#6f93ff; --tool:#35c68f; } }
  * { box-sizing: border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0; } .muted { color: var(--muted); } .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  .chip { display:inline-block; padding:2px 10px; border-radius:999px; font-weight:600; font-size:12px; border:1px solid var(--line); }
  .completed { color:var(--ok) } .failed,.crashed,.cancelled,.out_of_turns,.out_of_budget { color:var(--bad) } .running { color:var(--warn) }
  .cards { display:grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap:10px; margin:16px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .card b { display:block; font-size:20px; } .card span { color:var(--muted); font-size:12px; }
  .tabs { display:flex; gap:6px; margin:18px 0 10px; } .tabs button, .filters button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .tabs button.on, .filters button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .row { display:grid; grid-template-columns: minmax(180px, 34%) 1fr 70px; gap:10px; align-items:center; padding:5px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:hover, .row.sel { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .track { position:relative; height:14px; background:var(--code); border-radius:4px; }
  .bar { position:absolute; top:0; bottom:0; border-radius:4px; min-width:3px; } .bar.chat{background:var(--chat)} .bar.tool{background:var(--tool)} .bar.root{background:var(--muted)} .bar.err{background:var(--bad)}
  .bar.open { background: repeating-linear-gradient(45deg, var(--warn), var(--warn) 4px, transparent 4px, transparent 8px); }
  .dur { text-align:right; color:var(--muted); font-size:12px; }
  #detail { padding:12px 14px; } #detail h3 { margin:0 0 8px; font-size:15px; }
  table.kv { width:100%; border-collapse:collapse; } table.kv td { padding:3px 8px 3px 0; vertical-align:top; border-bottom:1px dashed var(--line); } table.kv td:first-child { color:var(--muted); width:230px; white-space:nowrap; }
  pre { background:var(--code); padding:10px; border-radius:8px; overflow:auto; white-space:pre-wrap; word-break:break-word; margin:6px 0; font-size:12.5px; max-height:380px; }
  .msg { padding:10px 14px; border-bottom:1px solid var(--line); } .msg .role { font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .role.assistant{color:var(--chat)} .role.tool{color:var(--tool)} .role.user{color:var(--warn)} .role.system{color:var(--muted)}
  .ev { color:var(--warn); } .err { color:var(--bad); }
</style>
</head>
<body>
<main>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1 id="title">Run</h1><span class="chip" id="status"></span></div>
  <div class="muted" id="goal" style="margin-top:4px"></div>
  <div class="muted mono" id="meta" style="margin-top:4px"></div>
  <div class="cards" id="cards"></div>
  <div class="tabs"><button data-t="timeline" class="on">Timeline</button><button data-t="convo">Conversation</button><button data-t="manifest">Manifest</button></div>

  <section id="timeline">
    <div class="filters" id="filters"></div>
    <div class="panel" id="rows"></div>
    <div class="panel" id="detail" style="margin-top:10px"><span class="muted">Click a row to see its details.</span></div>
  </section>
  <section id="convo" hidden><div class="panel" id="convoBody"></div></section>
  <section id="manifest" hidden><div class="panel" style="padding:12px 14px"><pre id="manifestPre"></pre></div></section>
</main>
<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const M = DATA.manifest, U = M.usage || {};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const fmt = s => s == null ? "–" : s < 1 ? Math.round(s * 1000) + " ms" : s.toFixed(s < 10 ? 2 : 1) + " s";

$("title").textContent = M.agent?.name || "Run";
$("status").textContent = M.status; $("status").classList.add(M.status);
$("goal").textContent = "Goal: " + (M.goal || "(not recorded)");
$("meta").textContent = `${M.run_id} · ${M.entry?.type || "cli"} · ${M.model?.name} · started ${M.started_at || ""} · ${fmt(M.duration_s)}${M.stop_reason ? " · " + M.stop_reason : ""}`;
const cards = [["Turns", U.turns], ["Model calls", U.llm_calls], ["Tokens in / out", `${U.input_tokens ?? 0} / ${U.output_tokens ?? 0}`],
  ["Tool calls", `${U.tool_calls ?? 0}${U.tool_errors ? " (" + U.tool_errors + " errors)" : ""}`], ["Guardrail blocks", U.guardrail_blocks],
  ["Approvals asked", `${U.approvals_asked ?? 0}${U.approvals_denied ? " (" + U.approvals_denied + " denied)" : ""}`],
  ["Model time", fmt(U.llm_time_s)], ["Tool time", fmt(U.tool_time_s)], ["Rate-limit waiting", fmt(U.rate_limit_wait_s)]];
for (const [k, v] of cards) { const c = el("div", "card"); c.append(el("b", "", v ?? "–"), el("span", "", k)); $("cards").append(c); }
if (M.error) { const e = el("div", "card err"); e.style.gridColumn = "1/-1"; e.append(el("b", "", M.error.type + ": " + M.error.message)); $("goal").after(e); }

// ── timeline ────────────────────────────────────────────────────────────────
const spans = DATA.spans, byId = Object.fromEntries(spans.map(s => [s.span_id, s]));
const t0 = Math.min(...spans.map(s => s.start_ns)), t1 = Math.max(...spans.map(s => s.end_ns || s.start_ns));
const total = Math.max(t1 - t0, 1);
const depth = s => { let d = 0, p = s.parent_id; while (p && byId[p]) { d++; p = byId[p].parent_id; } return d; };
const kind = s => s.attributes?.["gen_ai.operation.name"] === "chat" ? "chat" : s.attributes?.["gen_ai.operation.name"] === "execute_tool" ? "tool" : "root";
const isErr = s => s.status === "ERROR" || (s.events || []).some(e => e.name.startsWith("guardrail.blocked") || e.name === "approval.denied");
let filter = "all", selected = null;
const FILTERS = { all: "All", chat: "Model calls", tool: "Tool calls", issue: "Guardrails & errors" };
for (const [k, label] of Object.entries(FILTERS)) { const b = el("button", k === "all" ? "on" : "", label); b.onclick = () => { filter = k; [...$("filters").children].forEach(c => c.classList.toggle("on", c === b)); drawRows(); }; $("filters").append(b); }
function drawRows() {
  $("rows").replaceChildren();
  for (const s of spans) {
    const k = kind(s); if (filter === "chat" && k !== "chat") continue; if (filter === "tool" && k !== "tool") continue; if (filter === "issue" && !isErr(s)) continue;
    const row = el("div", "row" + (selected === s.span_id ? " sel" : "")); row.onclick = () => { selected = s.span_id; drawRows(); detail(s); };
    const n = el("div", "name"); n.style.paddingLeft = depth(s) * 16 + "px"; n.textContent = s.name; n.title = s.name;
    const track = el("div", "track"), bar = el("div", "bar " + (s.finished ? (isErr(s) ? "err" : k) : "open"));
    bar.style.left = ((s.start_ns - t0) / total * 100) + "%"; bar.style.width = (((s.end_ns || t1) - s.start_ns) / total * 100) + "%"; track.append(bar);
    row.append(n, track, el("div", "dur", s.finished ? fmt((s.end_ns - s.start_ns) / 1e9) : "unfinished")); $("rows").append(row);
  }
}
function kvTable(obj) { const t = el("table", "kv"); for (const [k, v] of Object.entries(obj || {})) { const r = el("tr"); r.append(el("td", "mono", k), el("td", "mono", typeof v === "object" ? JSON.stringify(v) : String(v))); t.append(r); } return t; }
function detail(s) {
  const d = $("detail"); d.replaceChildren(el("h3", "", s.name + (s.finished ? "" : "  — never finished (the run was interrupted)")));
  const a = { ...s.attributes }; const content = {}; for (const k of ["gen_ai.tool.call.arguments", "gen_ai.tool.call.result", "agent.goal"]) if (k in a) { content[k] = a[k]; delete a[k]; }
  d.append(kvTable(a));
  for (const e of s.events || []) { const p = el("div", "ev", "● " + e.name + (e.attributes?.reason ? " — " + e.attributes.reason : "")); d.append(p); }
  for (const [k, v] of Object.entries(content)) { d.append(el("div", "muted", k)); d.append(el("pre", "", typeof v === "string" ? v : JSON.stringify(v, null, 2))); }
  if (kind(s) === "chat") { const call = (DATA.llm_calls || []).find(c => c.turn === s.attributes["agent.turn"] && (c.latency_s === s.attributes["agent.llm.latency_s"] || true));
    if (call?.reply) { d.append(el("div", "muted", "model reply")); d.append(el("pre", "", (call.reply.text || "(no text)") + (call.reply.tool_calls?.length ? "\n\nasked for tools:\n" + call.reply.tool_calls.map(c => `  ${c.name}(${JSON.stringify(c.args)})`).join("\n") : ""))); } }
}
drawRows();

// ── conversation ────────────────────────────────────────────────────────────
function drawConvo() {
  const body = $("convoBody");
  if (DATA.system_prompt) { const m = el("div", "msg"), det = document.createElement("details"); det.append(el("summary", "", "System prompt (exactly what the model was told)"), el("pre", "", DATA.system_prompt)); m.append(el("div", "role system", "system"), det); body.append(m); }
  if (!DATA.llm_calls?.length) { body.append(el("div", "msg muted", "No model messages were recorded (TRACE_CONTENT=off, or the run stopped before the first model call).")); return; }
  for (const c of DATA.llm_calls) {
    for (const m of c.new_messages || []) { if (m.role === "assistant") continue; const box = el("div", "msg"); box.append(el("div", "role " + m.role, `${m.role} · turn ${c.turn}`), el("pre", "", m.content ?? `(${m.chars} characters, content not recorded)`)); body.append(box); }
    if (c.reply) { const box = el("div", "msg"); box.append(el("div", "role assistant", `assistant · turn ${c.turn} · ${fmt(c.latency_s)} · ${c.usage?.input ?? "?"}→${c.usage?.output ?? "?"} tokens`));
      if (c.reply.reasoning) { const det = document.createElement("details"); det.append(el("summary", "", "model's private thinking"), el("pre", "", c.reply.reasoning)); box.append(det); }
      box.append(el("pre", "", (c.reply.text || "") + (c.reply.tool_calls?.length ? "\n→ " + c.reply.tool_calls.map(t => `${t.name}(${JSON.stringify(t.args)})`).join("\n→ ") : ""))); body.append(box); }
    if (c.error) body.append(el("div", "msg err", "error: " + c.error));
  }
}
drawConvo();
$("manifestPre").textContent = JSON.stringify(M, null, 2);
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b)); for (const id of ["timeline", "convo", "manifest"]) $(id).hidden = id !== b.dataset.t; });
</script>
</body>
</html>
